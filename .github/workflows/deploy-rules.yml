# เผยแพร่ Firebase Rules อัตโนมัติ
# ทำงานเมื่อ push ไฟล์ database.rules.json ขึ้น main  (หรือกด Run workflow เองในแท็บ Actions)
# ต้องตั้งค่าครั้งเดียว: Settings › Secrets and variables › Actions › New repository secret
#   ชื่อ  FIREBASE_SERVICE_ACCOUNT   ค่า = เนื้อหาไฟล์ JSON ของ service account (สิทธิ์ Firebase Realtime Database Admin)
name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths: [database.rules.json]
  workflow_dispatch:

concurrency:
  group: firebase-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ตรวจ Rules ให้ตรงกับ app.js
        run: |
          node -e "
            const fs=require('fs');
            const r=JSON.parse(fs.readFileSync('database.rules.json','utf8')).rules;
            const v=(fs.readFileSync('app.js','utf8').match(/RULES_V\s*=\s*(\d+)/)||[])[1];
            if(!r.rulesProbe||!r.rulesProbe['v'+v]){console.error('rulesProbe ไม่มี v'+v+' — Rules กับ app.js คนละรุ่น');process.exit(1)}
            console.log('Rules รุ่น v'+v+' ตรงกับ app.js');"

      - name: ยังไม่ได้ตั้ง secret
        if: env.SA == ''
        run: echo "::warning::ยังไม่ได้ตั้ง FIREBASE_SERVICE_ACCOUNT — ข้ามการเผยแพร่ Rules"

      - name: เผยแพร่ Rules
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(grep -oE 'projectId *: *"[^"]+"' config.js | cut -d'"' -f2)
          npx --yes firebase-tools@13 deploy --only database --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
